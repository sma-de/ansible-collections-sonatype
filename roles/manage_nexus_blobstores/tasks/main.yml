---

   ## this role supports vars.d
  - include_role:
      name: smabot.base.expand_vardirs
    when: >-
      not (smabot_sonatype_manage_nexus_blobstore_args.skip_vardir_expand
      | default(False) )


  - smabot.sonatype.normalize_nexus_blobstore_manage_args:
    register: _tmp_nexus_roles_cfg
    no_log: >-
      {{ (smabot_sonatype_manage_nexus_blobstore_args.hide_secrets
       | default(True) ) != False }}

  - set_fact:
      smabot_sonatype_manage_nexus_blobstore_args_normed: >-
        {{ _tmp_nexus_roles_cfg.normalized }}
    no_log: "{{ _tmp_nexus_roles_cfg.normalized.hide_secrets }}"


  - name: set connection credentials when necessary
    set_fact:
      "{{ _iter_cred_vars.key }}": "{{ _iter_cred_vars.value }}"
    loop: >-
      {{ smabot_sonatype_manage_nexus_blobstore_args_normed.connection._export_vars.ansible
       | default({}, True) | dict2items() }}
    loop_control:
      loop_var: _iter_cred_vars

    ## might contain confidential server credentials and user secrets
    no_log: >-
      {{ smabot_sonatype_manage_nexus_blobstore_args_normed.hide_secrets }}


    ## manage blob stores by type
  - name: handle blob stores
    include_tasks: manage_blobstores.yml
    loop: >-
      {{ smabot_sonatype_manage_nexus_blobstore_args_normed.blobstores._export_cfgs.store_manage
       | dict2items }}
    loop_control:
      loop_var: _iter_blobstore
      label: "{{ _iter_blobstore.key }}"


    ## as these vars might contain highly valuable secrets it is a good
    ## idea to unset them after they are dont needed anymore
  - name: unset connection credentials when necessary
    set_fact:
      "{{ _iter_cred_vars.key }}":
    loop: >-
      {{ smabot_sonatype_manage_nexus_blobstore_args_normed.connection._export_vars.ansible
       | default({}, True) | dict2items() }}
    loop_control:
      loop_var: _iter_cred_vars
      label: "{{ _iter_cred_vars.key }}"


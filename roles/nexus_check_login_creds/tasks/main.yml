---

  - block:

       ## this role supports vars.d
      - include_role:
          name: smabot.base.expand_vardirs
        when: >-
          not (smabot_sonatype_nexus_check_login_creds_args.skip_vardir_expand
            | default(False) )


      - smabot.sonatype.normalize_nexus_check_login_creds_args:
        register: _tmp_nexus_users_cfg
        no_log: >-
          {{ (smabot_sonatype_nexus_check_login_creds_args.hide_secrets
           | default(True) ) != False }}

      - set_fact:
          smabot_sonatype_nx_check_login_args_normed: "{{ _tmp_nexus_users_cfg.normalized }}"
        no_log: "{{ _tmp_nexus_users_cfg.normalized.hide_secrets }}"


      - name: set connection credentials when necessary
        set_fact:
          "{{ _iter_cred_vars.key }}": "{{ _iter_cred_vars.value }}"
        loop: >-
          {{ smabot_sonatype_nx_check_login_args_normed.connection._export_vars.ansible
           | default({}, True) | dict2items() }}
        loop_control:
          loop_var: _iter_cred_vars

        ## might contain confidential server credentials and user secrets
        no_log: >-
          {{ smabot_sonatype_nx_check_login_args_normed.hide_secrets }}


      - name: check if valid nexus auth creds are already preset by environment
        smabot.sonatype.nexus_check_auth_creds:
        ignore_errors: true
        no_log: >-
          {{ smabot_sonatype_nx_check_login_args_normed.hide_secrets }}
        register: _tmp_nx_creds_check_preset

    delegate_to: localhost
    become: no


  - block:

      - set_fact:
          _tmp_nx_creds_check:
          _tmp_break_loop: false
        delegate_to: localhost
        become: no

      ## no valid preset auth creds, go through
      ## given list until we found some valid ones
      - include_tasks: check_next_creds.yml
        loop: >-
          {{ smabot_sonatype_nx_check_login_args_normed.credential_sources._export_configs.cred_sources_by_prio }}
        loop_control:
          loop_var: _iter_nx_auth_creds
          label: "{{ _iter_nx_auth_creds.mapkey }}"

          ## TODO: unfortunately is this feature to recent to be expected
          ##   to be avaible all the time, workaround atm with when, which
          ##   technically always runs all loop entries but at least runs
          ##   all skipped after the first hit
          ##break_when: >-
          ##  (_tmp_nx_creds_check.valid_creds | default(False)) is truthy
        when: not _tmp_break_loop

      - set_fact:
          smabot_sonatype_nexus_check_login_creds_return:
            auth_creds: "{{ _tmp_nx_creds_check.valid_creds }}"
        no_log: >-
          {{ smabot_sonatype_nx_check_login_args_normed.hide_secrets }}
        when: >-
          (_tmp_nx_creds_check.valid_creds | default(False)) is truthy
        delegate_to: localhost
        become: no

    when: _tmp_nx_creds_check_preset.failed | default(False)


##  - ansible.builtin.debug:
##      var: smabot_sonatype_nexus_check_login_creds_return

  - name: ensure wanted result is achieved
    ansible.builtin.assert:
      that:
        - >-
          not (_tmp_nx_creds_check_preset.failed | default(False))
          or (smabot_sonatype_nexus_check_login_creds_return.auth_creds
          | default(False)) is truthy
          or smabot_sonatype_nx_check_login_args_normed.optional
      fail_msg: >-
        Could not find any valid nexus login credentials, if this is
        an acceptable outcome set top-level 'optional' config key to true
    delegate_to: localhost
    become: no


    ## as these vars might contain highly valuable secrets it is a good
    ## idea to unset them after they are dont needed anymore
  - name: unset connection credentials when necessary
    set_fact:
      "{{ _iter_cred_vars.key }}":
    loop: >-
      {{ smabot_sonatype_nx_check_login_args_normed.connection._export_vars.ansible
       | default({}, True) | dict2items() }}
    loop_control:
      loop_var: _iter_cred_vars
      label: "{{ _iter_cred_vars.key }}"
    delegate_to: localhost
    become: no

